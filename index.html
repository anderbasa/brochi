<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nuestra lista</title>
<meta name="description" content="Nuestra lista de planes y recuerdos, solo para los dos.">
<meta name="theme-color" content="#f7efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nuestra lista">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="app"><div class="portada"><div class="logo-grande">🌱</div><p class="sub">Cargando…</p></div></div>

<script>
  // Red de seguridad: si algo revienta (aquí o en cualquier módulo), se ve un
  // aviso con el error en vez de quedarse la pantalla en blanco sin pistas.
  function mostrarErrorFatal(msg) {
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div style="max-width:420px;margin:15vh auto 0;padding:24px;text-align:center;' +
      'font-family:system-ui,sans-serif;color:var(--tinta,#3a322c);">' +
      '<div style="font-size:44px">⚠️</div>' +
      '<p style="font-weight:700;font-size:18px;margin:10px 0 4px">Ha ocurrido un error</p>' +
      '<p style="font-size:13px;color:var(--tinta-suave,#7a6f65);word-break:break-word;white-space:pre-wrap;">' +
      String(msg).replace(/</g, "&lt;") + '</p>' +
      '<p style="font-size:12px;color:var(--tinta-suave,#7a6f65);margin-top:16px">' +
      'Haz una captura de esta pantalla y envíasela.</p></div>';
  }
  window.addEventListener("error", function (e) {
    mostrarErrorFatal((e.message || "Error desconocido") + "\n" + (e.filename ? e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    mostrarErrorFatal("Promesa rechazada: " + (r && r.message ? r.message : String(r)));
  });
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
